<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Para Val 💖</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="background-glow"></div>
    <header class="hero">
        <div class="hero-content">
            <p class="eyebrow">Nuestro Libro de Aventuras</p>
            <h1>Feliz cumple Val!</h1>
            <p>Te hice un <strong>Libro de Aventuras</strong> nuestro. Te amo ❤️</p>
        </div>
    </header>
    <main class="page-content">
        <section class="gallery-section">
            <div class="section-title-wrap">
                <h2>Recuerdos que amo</h2>
                <p>Tocá el video para activar o desactivar el sonido.</p>
            </div>
            <section class="galeria" id="imageGrid">
                <div class="foto">
                    <img src="images/foto1.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/foto2.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/foto3.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/foto4.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/foto5.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/foto9.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/foto6.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/foto7.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/foto8.jpg" alt="foto con val">
                </div>
                <div class="foto video-foto">
                    <video id="val-video" src="images/valen.mp4" autoplay muted loop playsinline></video>
                </div>
                <div class="foto">
                    <img src="images/valen10.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/valen11.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/valen12.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/valen13.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/valen14.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/valen15.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/valen16.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/valen17.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/valen18.jpg" alt="foto con val">
                </div>
                <div class="foto">
                    <img src="images/valen19.jpg" alt="foto con val">
                </div>
            </section>
        </section>
        <div class="upload-section">
            <button id="addImageButton">Agregar Imagen o Video</button>
            <input type="file" id="imageUpload" accept="image/*,video/*" multiple style="display: none;">
        </div>
    </main>
    <footer>
        <p class="firma-animada">Con amor, de tu Pochi 🎨🤓</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
